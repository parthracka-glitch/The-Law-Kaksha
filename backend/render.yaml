services:
  - type: web
    name: the-law-kaksha-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://the-law-kaksha.vercel.app
      - key: JWT_SECRET
        generateValue: true
